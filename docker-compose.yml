services:
  jupyter:
    image: ${JUPYTER_IMAGE}
    container_name: jupyter
    ports:
      - "${JUPYTER_PORT}:8888"
      - "${SPARK_UI_PORT}:4040"
    environment:
      - JUPYTER_ENABLE_LAB=yes
      - JUPYTER_TOKEN=${JUPYTER_TOKEN}
    volumes:
      - ./notebooks:/home/jovyan/work
    depends_on:
      - kafka
      - spark-master
      - namenode 
    networks:
      - docker_compose_big_data

  zookeeper:
    image: confluentinc/cp-zookeeper:${CONFLUENT_VERSION}
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: ${ZOOKEEPER_CLIENT_PORT}
      ZOOKEEPER_TICK_TIME: ${ZOOKEEPER_TICK_TIME}
    networks:
      - docker_compose_big_data

  kafka:
    image: confluentinc/cp-kafka:${CONFLUENT_VERSION}
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "${KAFKA_PORT}:9092"
    environment:
      KAFKA_BROKER_ID: ${KAFKA_BROKER_ID}
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:${ZOOKEEPER_CLIENT_PORT}
      KAFKA_ADVERTISED_LISTENERS: ${KAFKA_ADVERTISED_LISTENERS}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: ${KAFKA_LISTENER_SECURITY_PROTOCOL_MAP}
      KAFKA_INTER_BROKER_LISTENER_NAME: ${KAFKA_INTER_BROKER_LISTENER_NAME}
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: ${KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR}
    networks:
      - docker_compose_big_data

  spark-master:
    image: apache/spark:${SPARK_VERSION}
    container_name: spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    environment:
      - SPARK_RPC_AUTHENTICATION_ENABLED=${SPARK_RPC_AUTH}
      - SPARK_SSL_ENABLED=${SPARK_SSL}
    ports:
      - "${SPARK_MASTER_WEBUI_PORT}:8080"
      - "${SPARK_MASTER_PORT}:7077"
    networks:
      - docker_compose_big_data

  spark-worker:
    image: apache/spark:${SPARK_VERSION}
    container_name: spark-worker
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:${SPARK_MASTER_PORT}
    environment:
      - SPARK_WORKER_MEMORY=${SPARK_WORKER_MEMORY}
      - SPARK_RPC_AUTHENTICATION_ENABLED=${SPARK_RPC_AUTH}
      - SPARK_SSL_ENABLED=${SPARK_SSL}
    depends_on:
      - spark-master
    networks:
      - docker_compose_big_data
  
  namenode:
    image: bde2020/hadoop-namenode:${HADOOP_VERSION}
    container_name: namenode
    environment:
      - CLUSTER_NAME=${HADOOP_CLUSTER_NAME}
    env_file:
      - ./hadoop.env
    ports:
      - "${HADOOP_NAMENODE_WEBUI_PORT}:9870"
      - "${HADOOP_NAMENODE_PORT}:9000"
    networks:
      - docker_compose_big_data

  datanode:
    image: bde2020/hadoop-datanode:${HADOOP_VERSION}
    container_name: datanode
    environment:
      - SERVICE_PRECONDITION=namenode:${HADOOP_NAMENODE_WEBUI_PORT}
    env_file:
      - ./hadoop.env
    networks:
      - docker_compose_big_data

networks:
  docker_compose_big_data:
    driver: bridge
    name: ${SHARED_NETWORK_NAME}